services:
    bbmi-chat:
        image: ghcr.io/rtgtx7/bbmi-chat:${BBMI_IMAGE_TAG:-latest}
        pull_policy: always
        restart: unless-stopped
        ports:
            - "${BBMI_PORT:-8080}:80"
        volumes:
            - type: bind
              source: ${BBMI_CONFIG:-./config.json}
              target: /app/config.json
              read_only: true
