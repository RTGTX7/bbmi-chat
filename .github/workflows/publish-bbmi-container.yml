name: Publish BBMI Chat container

on:
    push:
        branches:
            - develop
        tags:
            - "v*"
    workflow_dispatch:

concurrency:
    group: bbmi-container-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: write

env:
    IMAGE_NAME: ghcr.io/rtgtx7/bbmi-chat

jobs:
    publish:
        name: Build and publish
        runs-on: ubuntu-24.04
        steps:
            - name: Check out repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up QEMU
              uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate image metadata
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
              with:
                  images: ${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
                      type=sha,prefix=sha-,format=short
                      type=ref,event=tag
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                  labels: |
                      org.opencontainers.image.title=BBMI Chat
                      org.opencontainers.image.description=Responsive mobile-first Matrix messenger based on Element Web
                      org.opencontainers.image.source=https://github.com/RTGTX7/bbmi-chat

            - name: Build and push image
              id: build
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
              with:
                  context: .
                  file: apps/web/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=bbmi-chat
                  cache-to: type=gha,mode=max,scope=bbmi-chat
                  provenance: mode=max
                  sbom: true

            - name: Publish summary
              env:
                  DIGEST: ${{ steps.build.outputs.digest }}
                  TAGS: ${{ steps.meta.outputs.tags }}
              run: |
                  {
                    echo "## Published BBMI Chat image"
                    echo
                    echo "\`\`\`text"
                    echo "${TAGS}"
                    echo "\`\`\`"
                    echo
                    echo "Digest: \`${DIGEST}\`"
                  } >> "${GITHUB_STEP_SUMMARY}"
